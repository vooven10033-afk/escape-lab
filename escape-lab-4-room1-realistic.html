j:active{filter:brightness(1.5);transform:scale(.98)}.desk{left:17%;bottom:14%;width:42%;height:30%;background:linear-gradient(#6c5746 0 15%,#44392f 16% 70%,#292a2c)}.clock{right:16%;top:17%;width:21%;height:32%;border-radius:50%;background:radial-gradient(circle,#c8c4ac 0 57%,#514b43 59% 70%,#171d24 74%)}.clock .name{color:white}.shelf{left:9%;top:16%;width:37%;height:64%;background:repeating-linear-gradient(0deg,#332d2b 0 11%,#0e1c25 12% 14%,#574838 15% 16%)}.locker{right:10%;top:22%;width:30%;height:66%;background:linear-gradient(90deg,#253641,#5a6a73 40%,#23343e)}.cabinet{left:15%;bottom:13%;width:33%;height:50%;background:linear-gradient(#31414c,#111e27)}.board{right:12%;top:15%;width:38%;height:42%;background:linear-gradient(140deg,#b1a58a,#7a745f);color:#17232b;text-shadow:none}.board .name{color:white}.door{left:35%;top:18%;width:30%;height:72%;background:linear-gradient(100deg,#1a2a33,#566875 50%,#18252e);border:6px solid #101a22}.lamp{left:8%;top:14%;width:22%;height:35%}.panel{right:10%;top:28%;width:27%;height:37%}.nav{margin:10px 0}.nav button,.toolbar button,.modal button,.inventory button{background:#244458;color:#f3f8fa;border:1px solid #698799;border-radius:9px;padding:10px 12px}.nav button{flex:1}.nav button:disabled{opacity:.4}.inventory{justify-content:flex-start;padding:8px;background:#101f2a;border-radius:10px;min-height:68px}.inventory button{font-size:13px;padding:7px}.inventory button.selected{background:#b08a38;color:#101820;border-color:#f5d37e}.notice{min-height:36px;margin:10px 0;color:#e9d99d;font-size:14px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{width:min(100%,550px);max-height:90vh;overflow:auto;background:linear-gradient(#243b49,#0e202c);border:1px solid #78909c;border-radius:14px;padding:18px;box-shadow:0 15px 70px #000}.modal h2{margin:0 0 10px;font-size:22px}.modal p{line-height:1.7}.modal .actions{display:f </style></head><body><main class="app"><header class="top"><div><strong>ESCAPE LAB 4.0</strong><div class="small"><ruby>調査室<rt>ちょうさしつ</rt></ruby>・<ruby>第<rt>だい</rt></ruby>1エリア</div></div><span class="chip" id="count">0 / 4 <ruby>解除<rt>かいじょ</rt></ruby></span></header><div class="progress"><div id="bar" style="width:0%"></div></div><p class="small">左右のボタンで<ruby>向<rt>む</rt></ruby>きを<ruby>変<rt>か</rt></ruby>え、<ruby>気<rt>き</rt></ruby>になる<ruby>物<rt>もの</rt></ruby>をタップしよう。</p><section class="room" id="room" aria-label="研究室"><div class="ceiling"></div><div class="floor"></div><div class="wallTitle" id="wallTitle"></div><div id="objects"></div></section><nav class="nav"><button id="prev">◀ <ruby>左<rt>ひだり</rt></ruby></button><button id="back"><ruby>戻<rt>もど</rt></ruby>る</button><button id="next"><ruby>右<rt>みぎ</rt></ruby> ▶</button></nav><div class="toolbar"><span class="small">🎒 <ruby>持<rt>も</rt></ruby>ち<ruby>物<rt>もの</rt></ruby>（タップして<ruby>選択<rt>せんたく</rt></ruby>）</span><button id="help">💡 ヒント</button><button id="sound">🔊 <ruby>読<rt>よ</rt></ruby>む</button></div><div class="inventory" id="inventory"></div><p class="notice" id="notice" aria-live="polite"></p><footer>この<ruby>試作版<rt>しさくばん</rt></ruby>は<ruby>第<rt>だい</rt></ruby>1エリアのみ。<ruby>進行状況<rt>しんこうじょうきょう</rt></ruby>はこのブラウザに<ruby>自動保存<rt>じどうほぞん</rt></ruby>されます。 <button id="reset" style="background:transparent;color:#9fb7c3;border:0;text-decoration:underline">はじめから</button></footer></main><div id="overlay" class="overlay" hidden></div><script>
(()=>{'use strict';const KEY='escape_lab_4_room1_v1';const defaults=()=>({view:0,items:[],solved:[],flags:[],hint:0});let state;try{state=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=defaults()}let selected='',active='',message='';const $=id=>document.getElementById(id),has=x=>state.items.includes(x),flag=x=>state.flags.includes(x),solved=x=>state.solved.includes(x);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function add(x){if(!has(x))state.items.push(x);save();render()}function mark(x){if(!solved(x))state.solved.push(x);save();render()}function setFlag(x){if(!flag(x))state.flags.push(x);save();render()}function say(t){message=t;$('notice').textContent=t}function speech(t){if(!('speechSynthesis'in window)){say('このブラウザでは読み上げできません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}const ruby=(a,b)=>`<ruby>${a}<rt>${b}</rt></ruby>`;const labels={flash:'🔦 でんとう',battery:'🔋 でんち',torch:'💡 ひかるでんとう',memo:'📄 メモ',key:'🗝️ ちいさなかぎ',symbols:'🔣 きごうメモ',archive:'🗝️ しりょうしつのかぎ'};const walls=[{title:'① つくえ と とけい',objects:[['desk','desk','🗄️','つくえ'],['clock','clock','🕒','とけい']]},{title:'② ほんだな と ロッカー',objects:[['shelf','shelf','📚','ほんだな'],['locker','locker','🔐','ロッカー']]},{title:'③ くらい たな と けいじばん',objects:[['cabinet','cabinet','🌑','くらいたな'],['board','board','📋','けいじばん']]},{title:'④ とびら と そうち',objects:[['door','door','🚪','とびら'],['lamp','lamp','🔦','どうぐばこ'],['panel','panel','⚙️','そうち']]}];function render(){const w=walls[state.view];$('wallTitle').textContent=w.title;$('objects').innerHTML='';w.objects.forEach(([id,cls,emoji,name])=>{let b=document.createElement('button');b.className='obj '+cls;b.innerHTML=`<span class="symbol">${emoji}</span><span class="name">${name}</span>`;b.setAttribute('aria-label',name);b.onclick=()=>openObj(id);$('objects').appendChild(b)});$('inventory').innerHTML='';if(!state.items.length)$('inventory').textContent='まだ ありません';state.items.forEach(id=>{const b=document.createElement('button');b.textContent=labels[id]||id;b.className=selected===id?'selected':'';b.onclick=()=>{if(selected&&selected!==id){combine(selected,id);return}selected=selected===id?'':id;say(selected?'えらんだよ。ほかのアイテムをタップすると くみあわせられるよ。':'');render()};$('inventory').appendChild(b)});$('count').textContent=state.solved.length+' / 4 かいじょ';$('bar').style.width=(state.solved.length/4*100)+'%';$('notice').textContent=message;save()}
function modal(title,body,buttons=[]){active=title;const ov=$('overlay');ov.hidden=false;ov.innerHTML='';const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');const x=document.createElement('button');x.className='close';x.textContent='✕ とじる';x.onclick=close;m.appendChild(x);const h=document.createElement('h2');h.textContent=title;m.appendChild(h);const p=document.createElement('div');p.innerHTML=body;m.appendChild(p);const actions=document.createElement('div');actions.className='actions';buttons.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=fn;actions.appendChild(b)});m.appendChild(actions);ov.appendChild(m)}function close(){$('overlay').hidden=true;active='';render()}function take(id,text){add(id);say(text);close()}
function combine(a,b){selected='';if([a,b].includes('flash')&&[a,b].includes('battery')){state.items=state.items.filter(x=>x!=='flash'&&x!=='battery');add('torch');say('カチッ！ でんとうが ひかった！');modal('アイテムが できた！','🔦 ＋ 🔋 → 💡<p>これで くらい ところを しらべられる！</p>')}else{say('この ふたつは くみあわせられないみたい。');render()}}
function openObj(id){switch(id){case 'desk':modal('つくえ',`<p>ひきだしに 3けたの ダイヤルが ある。</p><p>つくえの うえに ふるい メモも ある。</p>`,[['メモを ひろう',()=>has('memo')?modal('メモ','<div class="note">とけい：<br>みじかい はり＝ほんの かず<br>ながい はり＝あかい しるし</div>'):take('memo','メモを てにいれた！')],['ダイヤルを しらべる',()=>dial()]]);break;
case 'clock':modal('とけい',`<div class="clockface">🕰️</div><p>はりを あわせると うごきそうだ。</p>${solved('clock')?'<p>もう しかけは とけている。</p>':''}`,[['はりを あわせる',clockPuzzle]]);break;
case 'shelf':modal('ほんだな',`<p>3さつの ほんが ならんでいる。</p><div class="note">🌳🌳🌳<br>「${ruby('木','き')}」の えが ある ほんは 3さつ。</div><p>せびょうしに ① ② ③ の ばんごうが ある。</p>`,[['ほんを しらべる',()=>modal('ほんの なか','<p>3ばんの ほんに「<strong>3</strong>」と かかれた しおりが ある。</p><p>うらには「<strong>ながい はり＝6</strong>」の しるし。</p>')]]);break;
case 'locker':if(solved('locker'))modal('ロッカー','<p>もう あいている。しりょうしつの かぎを てにいれた。</p>');else modal('ロッカー',`<p>3つの きごうを ならべる ロックだ。</p><p>ヒント：くらい たなに あるかも。</p>`,[['きごうを いれる',lockerPuzzle]]);break;
case 'cabinet':if(!has('torch'))modal('くらい たな','<p>まっくらで なにも みえない。</p><p>あかりが あれば しらべられそう。</p>');else if(!flag('cabinet'))modal('くらい たな','<p>でんとうで てらすと、かべに 3つの きごうが うかんだ！</p><div class="note">★ → ● → ▲</div>',[['きごうを メモする',()=>{setFlag('cabinet');take('symbols','きごうを メモした！')}]]);else modal('くらい たな','<div class="note">★ → ● → ▲</div>');break;
case 'board':modal('けいじばん',`<p>けんきゅういんの メモが ある。</p><div class="note">${ruby('時計','とけい')}の ヒント<br>・みじかい はり＝ほんの かず<br>・ながい はり＝ほんの うらの しるし<br><hr>ひきだしの ばんごう：<strong>ほん・とけい・ロッカー</strong> の じゅん</div>`);break;
case 'door':modal('しりょうしつへの とびら',has('archive')?'<p>カギが あった！ とびらが ひらいた！</p><p>この さきは つぎの アップデートで つくるよ。</p>':'<p>カギが かかっている。ロッカーの なかに ありそう。</p>',has('archive')?[['とびらを あける',()=>{setFlag('finished');modal('🎉 だい1エリア クリア！','<p>おめでとう！ 4つの しかけを といたね。</p><p>つぎは しりょうしつへ すすむ じゅんびが できた！</p>')}]]:[]);break;
case 'lamp':modal('どうぐばこ',has('flash')||has('torch')?'<p>からっぽだ。</p>':'<p>でんちの ない でんとうが ある。</p>',has('flash')||has('torch')?[]:[['でんとうを ひろう',()=>take('flash','でんとうを てにいれた！')]]);break;
case 'panel':modal('そうち',`<p>4つの ランプが ある。${state.solved.length}こ ひかっている。</p><p>ちいさな メモ：ひきだしの 3けたは <strong>3・3・6</strong> に かんけいする。ただし じゅんばんは けいじばんを みよう。</p>`);break;}}
function dial(){if(solved('drawer')){modal('ひきだし','<p>ひきだしは あいている。</p>',has('battery')||has('torch')?[]:[['でんちを ひろう',()=>take('battery','でんちを てにいれた！')]]);return}puzzle('ひきだしの ダイヤル','ほん・とけい・ロッカーの じゅんで 3けたの ばんごうを いれよう。','336',()=>{mark('drawer');take('battery','カチッ！ ひきだしが あいて でんちを てにいれた！')})}
function clockPuzzle(){if(solved('clock')){modal('とけい','<p>とけいの うらが あいている。</p>',has('key')?[]:[['かぎを ひろう',()=>take('key','ちいさな かぎを てにいれた！')]]);return}modal('とけいの はり',`<p>みじかい はり（じ）と ながい はり（ふん）を えらぼう。</p><label>じ：<select id="hour">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>　<label>ふん：<select id="minute">${[0,5,10,15,20,25,30,35,40,45,50,55].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label>`,[['あわせる',()=>{if(+$('hour').value===3&&+$('minute').value===30){mark('clock');modal('カチッ！','<p>とけいの うらから ちいさな かぎが でてきた！</p>',[['かぎを ひろう',()=>take('key','ちいさな かぎを てにいれた！')]])}else modal('まだ ちがう','<p>ほんだな と メモを もういちど しらべよう。</p>',[['もういちど',clockPuzzle]])}]] )}
function lockerPuzzle(){if(!flag('cabinet')){modal('ロッカーの ロック','<p>3つの きごうを しらべよう。どこかに かくれているはず。</p>');return}modal('きごう ロック',`<p>ただしい じゅんに えらぼう。</p><div class="options">${['★','●','▲'].map((x,i)=>`<button data-symbol="${x}">${x}</button>`).join('')}</div><p id="seq">えらんだ きごう：</p>`,[['けす',()=>lockerPuzzle]]);let seq='';document.querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>{seq+=b.dataset.symbol;$('seq').textContent='えらんだ きごう：'+seq;if(seq.length===3){if(seq==='★●▲'){mark('locker');modal('ロッカーが あいた！','<p>なかに しりょうしつの かぎが ある！</p>',[['かぎを ひろう',()=>take('archive','しりょうしつの かぎを てにいれた！')]])}else modal('じゅんばんが ちがう','<p>もういちど きごうを かくにんしよう。</p>',[['やりなおす',lockerPuzzle]])}})}
function puzzle(title,desc,answer,success){modal(title,`<p>${desc}</p><input id="answer" inputmode="numeric" maxlength="3" autocomplete="off" style="font-size:24px;width:100%;padding:10px;border-radius:7px" placeholder="3けたの すうじ">`,[['かくにん',()=>{if($('answer').value===answer)success();else modal('まだ ちがう','<p>ほかの ばしょの ヒントを みてみよう。</p>',[['もういちど',dial]])}]])}
const hints=['まず 4つの かべを みて、つくえの メモと どうぐばこの でんとうを さがそう。','ほんだなの ほんと けいじばんを みよう。とけいの じこくは 3じ30ぷん。','ひきだしの ばんごうは 336。でんとうと でんちを くみあわせ、くらい たなを てらそう。','くらい たなの きごうは ★ ● ▲。ロッカーを あけて かぎを とろう。'];$('help').onclick=()=>{const i=Math.min(state.hint,3);modal('ヒント '+(i+1)+'/4',`<div class="hint">${hints[i]}</div>`,i<3?[['つぎの ヒント',()=>{state.hint=i+1;save();$('help').click()}]]:[])};$('sound').onclick=()=>speech(message||'左右のボタンで向きを変え、気になるものをタップしよう。');$('prev').onclick=()=>{state.view=(state.view+3)%4;render()};$('next').onclick=()=>{state.view=(state.view+1)%4;render()};$('back').onclick=()=>{selected='';say('へやを みわたそう');render()};$('reset').onclick=()=>{if(confirm('はじめから やりなおす？ セーブも きえるよ。')){state=defaults();selected='';say('さいしょから スタート！');render()}};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});render();say('へやの どこかに 4つの しかけが ある。さがしてみよう！');
})();</script></body></html>
