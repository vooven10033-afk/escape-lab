%;width:17%;height:21%;background:#1b2834;border:5px solid #81909a;border-radius:8px;color:#91d8be;font:700 18px monospace}.note{left:40%;top:49%;width:13%;height:10%;background:#dfcda7;color:#31291d;transform:rotate(-9deg);font-size:23px}.controls{margin:10px 0}.controls button{flex:1}.inv{justify-content:flex-start;flex-wrap:wrap;background:#142333;border:1px solid #344b60;border-radius:10px;padding:9px;margin:8px 0;min-height:54px}.inv button{font-size:12px;padding:8px}.inv button.selected{background:#a47b39;border-color:#ffe1a3;color:#0d1720}.hintline{color:#b4c9d7;font-size:12px;line-height:1.6}.modal{position:fixed;inset:0;background:#02060bdc;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.panel{background:linear-gradient(#263746,#101e2b);border:2px solid #728b9a;border-radius:14px;max-width:570px;width:100%;max-height:92dvh;overflow:auto;padding:18px;box-shadow:0 12px 60px #000}.panel h2{margin:0 0 12px;font-size:22px}.panel p{line-height:1.8}.panel .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.panel .actions button{flex:1;min-width:85px}.close{float:right}.clockface{margin:12px auto;border:12px solid #78654b;background:#e9e1c8;color:#1b2933;width:min(65vw,230px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;font:700 26px monospace}.hand{position:absolute;left:49%;bottom:50%;width:5px;background:#1c2c3b;transform-origin:bottom;border-radius:4px}.hour{height:28%}.minute{height:40%;width:3px}.slots{display:flex;gap:8px;justify-content:center;margin:15px}.slots button{font-size:25px;min-width:62px}.success{color:#8af0bd;font-weight:bold}.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#152f38;border:1px solid #83e6ca;border-radius:12px;padding:12px 18px;z-index:10;max-width:92%;text-align:center;display:none}ruby rt{font-size:.58em;color:#bcd5e7}#ending{display:none;text-align:center;padding:20px}#ending h2{color:#91efbf;font-size:30px}@media(min-width:700px){.scene{aspect-ratio:1.8}}
</style></head><body><main><header><h1>ESCAPE LAB <small>3.0</small></h1><button class="small" onclick="showHelp()">❔ ヘルプ</button></header><div class="bar"><span id="viewname">🔎 <ruby>調査室<rt>ちょうさしつ</rt></ruby></span><span id="progress">🔒 <ruby>出口<rt>でぐち</rt></ruby>を<ruby>探<rt>さが</rt></ruby>そう</span></div><div class="scene" id="scene"><div class="light"></div><div class="floor"></div></div><div class="controls"><button onclick="turn(-1)">◀ <ruby>左<rt>ひだり</rt></ruby></button><button onclick="openHint()">💡 ヒント</button><button onclick="turn(1)"><ruby>右<rt>みぎ</rt></ruby> ▶</button></div><div class="inv" id="inventory">🎒 <ruby>持<rt>も</rt></ruby>ち<ruby>物<rt>もの</rt></ruby>：なし</div><div class="hintline" id="message">👆 <ruby>気<rt>き</rt></ruby>になる<ruby>物<rt>もの</rt></ruby>をタップ！ <ruby>左右<rt>さゆう</rt></ruby>で<ruby>向<rt>む</rt></ruby>きを<ruby>変<rt>か</rt></ruby>えられるよ。</div><div id="ending"><h2>🎉 ESCAPE SUCCESS!</h2><p><ruby>研究室<rt>けんきゅうしつ</rt></ruby>からの<ruby>脱出<rt>だっしゅつ</rt></ruby>に<ruby>成功<rt>せいこう</rt></ruby>！</p><button onclick="restart()">もう<ruby>一度<rt>いちど</rt></ruby><ruby>遊<rt>あそ</rt></ruby>ぶ</button></div></main><div class="modal" id="modal"><div class="panel"><button class="close small" onclick="closeModal()">✕ <ruby>戻<rt>もど</rt></ruby>る</button><div id="modalcontent"></div></div></div><div class="toast" id="toast"></div><script>
const S={view:0,items:[],selected:null,note:false,clock:false,drawer:false,kanji:false,safe:false,device:false,exit:false,hints:0,hour:12,minute:0,order:[],code:[]};const names=['<ruby>机<rt>つくえ</rt></ruby>と<ruby>時計<rt>とけい</rt></ruby>','<ruby>本棚<rt>ほんだな</rt></ruby>と<ruby>金庫<rt>きんこ</rt></ruby>','<ruby>実験装置<rt>じっけんそうち</rt></ruby>','<ruby>出口<rt>でぐち</rt></ruby>'];let speech;
function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();speech=new SpeechSynthesisUtterance(t);speech.lang='ja-JP';speech.rate=.85;speechSynthesis.speak(speech)}
function msg(t){document.getElementById('message').innerHTML=t}function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2300)}
function add(item){if(!S.items.includes(item))S.items.push(item);S.selected=item;renderInv();toast('🎒 '+item+' を<ruby>手<rt>て</rt></ruby>に<ruby>入<rt>い</rt></ruby>れた！')}
function renderInv(){const e=document.getElementById('inventory');e.innerHTML='🎒 '+(S.items.length?S.items.map(x=>`<button class="${S.selected===x?'selected':''}" onclick="selectItem('${x}')">${x}</button>`).join(''):'<ruby>持<rt>も</rt></ruby>ち<ruby>物<rt>もの</rt></ruby>：なし')}
function selectItem(x){S.selected=S.selected===x?null:x;renderInv();msg(S.selected?'「'+S.selected+'」を<ruby>選択中<rt>せんたくちゅう</rt></ruby>。<ruby>使<rt>つか</rt></ruby>いたい<ruby>場所<rt>ばしょ</rt></ruby>をタップ！':'<ruby>選択<rt>せんたく</rt></ruby>を<ruby>解除<rt>かいじょ</rt></ruby>したよ。')}
function take(x){S.items=S.items.filter(v=>v!==x);S.selected=null;renderInv()}
function obj(cls,style,label,fn,extra=''){return `<button class="obj ${cls}" style="${style}" onclick="${fn}()" aria-label="${label}">${extra}<span>${label}</span></button>`}
function render(){const e=document.getElementById('scene');let x='<div class="light"></div><div class="floor"></div>';if(S.view===0){x+=obj('desk','','机','desk');x+=obj('clock','','時計','clock');if(!S.note)x+=obj('note','','メモ','note','✎')}if(S.view===1){x+=obj('bookshelf','','本棚','books');x+=obj('safe','','金庫','safe')}if(S.view===2)x+=obj('device','','実験装置','device');if(S.view===3){x+=obj('door','','出口','door');x+=obj('keypad','','カード読み取り機','door','▣')}e.innerHTML=x;document.getElementById('viewname').innerHTML='🔎 '+names[S.view];document.getElementById('progress').innerHTML=`<ruby>解決<rt>かいけつ</rt></ruby> ${[S.note,S.clock,S.drawer,S.kanji,S.safe,S.exit].filter(Boolean).length}/6`}
function turn(d){S.view=(S.view+d+4)%4;render();msg('👆 <ruby>物<rt>もの</rt></ruby>をタップして<ruby>調<rt>しら</rt></ruby>べよう。')}
function modal(html){document.getElementById('modalcontent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');render()}
function note(){S.note=true;add('📝 メモ');modal('<h2>📝 <ruby>机<rt>つくえ</rt></ruby>のメモ</h2><p><ruby>時計<rt>とけい</rt></ruby>の<ruby>絵<rt>え</rt></ruby>がある。</p><div style="font-size:64px;text-align:center">🕞</div><p style="text-align:center"><strong>3:30</strong></p><button onclick="say(\'さんじ さんじゅっぷん\')">🔊 <ruby>読<rt>よ</rt></ruby>み<ruby>上<rt>あ</rt></ruby>げ</button>');render()}
function clock(){modal('<h2>🕒 <ruby>壁<rt>かべ</rt></ruby>の<ruby>時計<rt>とけい</rt></ruby></h2><p><ruby>針<rt>はり</rt></ruby>を<ruby>動<rt>うご</rt></ruby>かせるようだ。<ruby>時<rt>じ</rt></ruby>と<ruby>分<rt>ふん</rt></ruby>を<ruby>合<rt>あ</rt></ruby>わせよう。</p><div class="clockface"><div class="hand hour" id="hourhand"></div><div class="hand minute" id="minutehand"></div><span id="time"></span></div><div class="actions"><button onclick="S.hour=S.hour%12+1;drawClock()"><ruby>時<rt>じ</rt></ruby> ＋1</button><button onclick="S.minute=(S.minute+5)%60;drawClock()"><ruby>分<rt>ふん</rt></ruby> ＋5</button></div><div class="actions"><button onclick="S.hour=12;S.minute=0;drawClock()">↺ リセット</button><button onclick="checkClock()">🔐 <ruby>決定<rt>けってい</rt></ruby></button></div>');drawClock()}
function drawClock(){document.getElementById('hourhand').style.transform=`rotate(${(S.hour%12)*30+S.minute*.5}deg)`;document.getElementById('minutehand').style.transform=`rotate(${S.minute*6}deg)`;document.getElementById('time').textContent=`${S.hour}:${String(S.minute).padStart(2,'0')}`}
function checkClock(){if(S.hour===3&&S.minute===30){if(!S.clock){S.clock=true;add('🗝️ <ruby>小<rt>ちい</rt></ruby>さな<ruby>鍵<rt>かぎ</rt></ruby>')}modal('<h2 class="success">カチッ！</h2><p><ruby>時計<rt>とけい</rt></ruby>の<ruby>下<rt>した</rt></ruby>から<ruby>鍵<rt>かぎ</rt></ruby>が<ruby>出<rt>で</rt></ruby>てきた！</p>')}else toast('まだ<ruby>何<rt>なに</rt></ruby>も<ruby>起<rt>お</rt></ruby>きない……')}
function desk(){if(!S.drawer){if(S.selected&&S.selected.includes('小')){S.drawer=true;take(S.selected);add('🀄 <ruby>漢字<rt>かんじ</rt></ruby>カード');modal('<h2 class="success">ガチャッ！</h2><p><ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>しが<ruby>開<rt>あ</rt></ruby>いた！<ruby>中<rt>なか</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>カードがあった。</p>')}else modal('<h2>🗄️ <ruby>机<rt>つくえ</rt></ruby>の<ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>し</h2><p><ruby>鍵<rt>かぎ</rt></ruby>がかかっている。<ruby>小<rt>ちい</rt></ruby>さな<ruby>鍵<rt>かぎ</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>そうだ。</p>')}else modal('<h2>🗄️ <ruby>机<rt>つくえ</rt></ruby></h2><p><ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>しは<ruby>開<rt>あ</rt></ruby>いている。</p>')}
function books(){if(S.kanji)return modal('<h2>📚 <ruby>本棚<rt>ほんだな</rt></ruby></h2><p><ruby>本棚<rt>ほんだな</rt></ruby>が<ruby>動<rt>うご</rt></ruby>き、<ruby>金庫<rt>きんこ</rt></ruby>の<ruby>仕掛<rt>しか</rt></ruby>けが<ruby>使<rt>つか</rt></ruby>えるようになった。</p>');if(!S.items.some(x=>x.includes('カード')))return modal('<h2>📚 <ruby>本棚<rt>ほんだな</rt></ruby></h2><p><ruby>本<rt>ほん</rt></ruby>に3つの<ruby>空<rt>あ</rt></ruby>いた<ruby>場所<rt>ばしょ</rt></ruby>がある。<ruby>何<rt>なに</rt></ruby>かをはめるようだ。</p>');S.order=[];drawBooks()}
function drawBooks(){modal('<h2>📚 <ruby>漢字<rt>かんじ</rt></ruby>パズル</h2><p><ruby>木<rt>き</rt></ruby>の<ruby>数<rt>かず</rt></ruby>が<ruby>少<rt>すく</rt></ruby>ない<ruby>順<rt>じゅん</rt></ruby>に、カードを<ruby>並<rt>なら</rt></ruby>べよう。</p><div class="slots">'+[0,1,2].map(i=>`<button onclick="undoBook()">${S.order[i]||'？'}</button>`).join('')+'</div><div class="actions">'+['森','木','林'].filter(x=>!S.order.includes(x)).map(x=>`<button onclick="pickBook('${x}')">${x}</button>`).join('')+'</div><div class="actions"><button onclick="S.order=[];drawBooks()">↺ やり<ruby>直<rt>なお</rt></ruby>す</button><button onclick="checkBooks()"><ruby>決定<rt>けってい</rt></ruby></button></div><button onclick="say(\'き、はやし、もり。きが いっぽん、にほん、さんぼん\')">🔊 <ruby>読<rt>よ</rt></ruby>み<ruby>上<rt>あ</rt></ruby>げ</button>')}
function pickBook(x){if(S.order.length<3){S.order.push(x);drawBooks()}}function undoBook(){S.order.pop();drawBooks()}function checkBooks(){if(S.order.join('')==='木林森'){S.kanji=true;modal('<h2 class="success">ゴゴゴ……！</h2><p><ruby>本棚<rt>ほんだな</rt></ruby>が<ruby>少<rt>すこ</rt></ruby>し<ruby>動<rt>うご</rt></ruby>いた！<ruby>金庫<rt>きんこ</rt></ruby>のロックが<ruby>解除<rt>かいじょ</rt></ruby>された。</p>')}else toast('<ruby>順番<rt>じゅんばん</rt></ruby>が<ruby>違<rt>ちが</rt></ruby>うみたい……')}
function device(){S.device=true;modal('<h2>🔬 <ruby>実験装置<rt>じっけんそうち</rt></ruby></h2><p><ruby>画面<rt>がめん</rt></ruby>に3つの<ruby>文字<rt>もじ</rt></ruby>が<ruby>光<rt>ひか</rt></ruby>っている。</p><div style="font:700 45px monospace;color:#8bf0ca;text-align:center;letter-spacing:12px">K E Y</div><p><ruby>金庫<rt>きんこ</rt></ruby>の<ruby>文字<rt>もじ</rt></ruby>と<ruby>関係<rt>かんけい</rt></ruby>があるかも？</p><button onclick="say(\'ケー、イー、ワイ\')">🔊 <ruby>読<rt>よ</rt></ruby>み<ruby>上<rt>あ</rt></ruby>げ</button>')}
function safe(){if(!S.kanji)return modal('<h2>🔒 <ruby>金庫<rt>きんこ</rt></ruby></h2><p><ruby>本棚<rt>ほんだな</rt></ruby>の<ruby>仕掛<rt>しか</rt></ruby>けとつながっているようだ。</p>');if(S.safe)return modal('<h2>🔓 <ruby>金庫<rt>きんこ</rt></ruby></h2><p>もう<ruby>中<rt>なか</rt></ruby>には<ruby>何<rt>なに</rt></ruby>もない。</p>');S.code=[];drawSafe()}
function drawSafe(){modal('<h2>🔒 <ruby>金庫<rt>きんこ</rt></ruby>の<ruby>文字<rt>もじ</rt></ruby></h2><p><ruby>実験装置<rt>じっけんそうち</rt></ruby>の<ruby>文字<rt>もじ</rt></ruby>を<ruby>順番<rt>じゅんばん</rt></ruby>に<ruby>入力<rt>にゅうりょく</rt></ruby>しよう。</p><div class="slots">'+[0,1,2].map(i=>`<button onclick="S.code.pop();drawSafe()">${S.code[i]||'_'}</button>`).join('')+'</div><div class="actions">'+['Y','K','E'].filter(x=>!S.code.includes(x)).map(x=>`<button onclick="S.code.push('${x}');drawSafe()">${x}</button>`).join('')+'</div><div class="actions"><button onclick="S.code=[];drawSafe()">↺ リセット</button><button onclick="checkSafe()"><ruby>決定<rt>けってい</rt></ruby></button></div>')}
