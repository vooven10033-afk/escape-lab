<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESCAPE LAB 2.0</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#193c5a,#081321 65%);color:#eaf6ff}main{max-width:740px;margin:auto;padding:18px}h1{letter-spacing:.13em;color:#6ce7ff}h2{font-size:1.45rem}.top,.bar,.actions,.choices{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.pill,.btn{border:1px solid #527797;background:#17314b;color:white;border-radius:12px;padding:12px;font-size:1rem}.btn{cursor:pointer;min-height:48px}.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid #67f6d5}.btn.primary{background:#087c9d}.btn:disabled{opacity:.4}.panel{background:#10243b;border:1px solid #426482;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 12px 30px #0004}.scene{min-height:175px;border:2px solid #3c7398;border-radius:16px;background:linear-gradient(120deg,#0d253e,#1c4160);display:grid;place-items:center;text-align:center;font-size:3.4rem;padding:18px}.scene small{display:block;font-size:1rem;color:#a7d2e8}.muted{color:#bdd3e4;line-height:1.7}.message{min-height:45px;color:#86f1c9;font-weight:bold;line-height:1.6}.choices{margin:14px 0}.choices .btn{flex:1 1 110px}.inventory{display:flex;gap:8px;flex-wrap:wrap}.item{border-radius:20px;background:#24435c;padding:8px 12px}.progress{height:9px;background:#233b52;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#64e2c8;transition:width .2s}.hidden{display:none}button{font:inherit}#log{font-size:.9rem;color:#a7d2e8}input{font:inherit;background:#081c2e;border:1px solid #6c99b3;border-radius:10px;padding:12px;color:white;width:100%;max-width:220px} .clock{width:170px;height:170px;border:8px solid #a3d8ee;border-radius:50%;margin:15px auto;position:relative;background:#0b243a}.clock:before{content:'12';position:absolute;top:3px;left:50%;transform:translateX(-50%)}.clock:after{content:'6';position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}.hand{position:absolute;bottom:50%;left:calc(50% - 3px);width:6px;border-radius:6px;transform-origin:bottom;background:#67f3db}.hour{height:47px}.minute{height:66px;background:#fff}.clock i{position:absolute;width:12px;height:12px;border-radius:50%;background:#f9da7c;left:calc(50% - 6px);top:calc(50% - 6px)}footer{font-size:.8rem;color:#8ea8ba;text-align:center;padding:20px}</style></head><body><main><div class="top"><h1>ESCAPE LAB <span style="font-size:.6em">2.0</span></h1><span class="pill" id="stage">SECTOR 01 / 05</span></div><div class="progress"><div id="progress"></div></div><div class="panel"><div class="scene" id="scene">🚪<small>通信が切れた研究所。出口を探せ。</small></div><h2 id="title">封鎖された研究所</h2><p class="muted" id="story"></p><div class="bar"><button class="btn" id="speak">🔊 よみあげ</button><button class="btn" id="hint">💡 ヒント</button><button class="btn" id="reset">↻ 最初から</button></div><p class="message" id="msg" aria-live="polite"></p><div id="game"></div></div><div class="panel"><strong>🎒 持ち物</strong><div class="inventory" id="inventory"><span class="muted">まだ何もない</span></div></div><p id="log"></p><footer>失敗しても何度でも挑戦できる。通信料以外は無料。</footer></main><script>
(()=>{'use strict';let phase=0,step=0,inventory=[],mistakes=0,hintCount=0;const $=id=>document.getElementById(id);const titles=['消えた電源','漢字の保管庫','時刻の制御室','文字の通信室','最後のゲート'];const scenes=['🔦 📦 🔌','📚 🔐 🗃️','🕒 ⚙️ 🚪','🔡 📡 💻','🚨 🔒 🚪'];const stories=['暗い研究所で目が覚めた。電源を戻すには、部屋を調べて必要なものを集めよう。','棚の奥に秘密の箱がある。漢字のメモを読めば、鍵が見つかりそうだ。','時計が止まっている。壁のメモを読んで、装置の時刻を合わせよう。','通信装置にはアルファベットの暗号がある。文字の形と順番が鍵になる。','集めた情報を使って、最後の扉のロックを解除しよう。'];const add=x=>{if(!inventory.includes(x))inventory.push(x);renderInv()};function renderInv(){$('inventory').innerHTML=inventory.length?inventory.map(x=>`<span class="item">${x}</span>`).join(''):'<span class="muted">まだ何もない</span>'}function msg(s){$('msg').textContent=s}function btn(label,fn){let b=document.createElement('button');b.className='btn';b.textContent=label;b.addEventListener('click',fn);return b}function choices(items,correct,onSuccess,explain){let wrap=document.createElement('div');wrap.className='choices';items.forEach((v,i)=>wrap.appendChild(btn(v,()=>{if(i===correct){msg('🔓 正解！ '+(explain||''));onSuccess()}else{mistakes++;msg('まだ違うみたい。部屋の手がかりを見直そう。')}})));$('game').appendChild(wrap)}function text(s){let p=document.createElement('p');p.className='muted';p.textContent=s;$('game').appendChild(p)}function next(label,fn){$('game').appendChild(btn(label,fn))}function advance(){phase++;step=0;hintCount=0;render()}function tick(){step++;hintCount=0;render()}function render(){if(phase>=5){finish();return} $('stage').textContent=`SECTOR 0${phase+1} / 05`;$('progress').style.width=(phase*20+step*4)+'%';$('scene').innerHTML=scenes[phase]+'<small>手がかりを探し、ロックを解除せよ</small>';$('title').textContent=titles[phase];$('story').textContent=stories[phase];$('game').innerHTML='';msg('');$('log').textContent='間違いはゲームオーバーにならない。調べて考えよう。';if(phase===0)room();if(phase===1)kanji();if(phase===2)clock();if(phase===3)alphabet();if(phase===4)gate()}function room(){if(step===0){text('机・棚・ロッカーの3か所を調べられる。まず、机に何がある？');choices(['机を調べる','ドアを蹴る','何もしない'],0,()=>{add('🔋 電池');tick()},'電池を見つけた！')}else if(step===1){text('棚には「青い箱」と「赤い箱」がある。メモには「海と同じ色」と書いてある。');choices(['赤い箱','青い箱','どちらも開けない'],1,()=>{add('🔑 小さな鍵');tick()},'青い箱から鍵が出てきた！')}else if(step===2){text('ロッカーには鍵穴がある。どの持ち物を使う？');choices(['電池','小さな鍵','素手'],1,()=>{add('📝 漢字メモ');tick()},'メモには「光 → 森 → 門」と書かれている。')}else{text('電池を装置に入れると、廊下の灯りがついた。次の部屋へ進める！');next('▶ 漢字の保管庫へ',advance)}}function kanji(){if(step===0){text('扉の表示：「くらい部屋を あかるくするもの」 漢字を選べ。');choices(['音','光','石'],1,()=>tick(),'「光」は「ひかり」。')}else if(step===1){text('古い地図には「木がたくさん集まる場所」とある。どの漢字？');choices(['森','川','空'],0,()=>tick(),'木が3つで「森」。')}else if(step===2){text('箱には「出入りするところ」と書いてある。正しい漢字を選べ。');choices(['雲','門','雪'],1,()=>{add('🔐 漢字コード：光森門');tick()},'「門」は「もん」。')}else if(step===3){text('最初の部屋のメモ「光 → 森 → 門」と一致した！箱の中から歯車を発見。');next('⚙️ 歯車を取る',()=>{add('⚙️ 歯車');tick()})}else{next('▶ 時刻の制御室へ',advance)}}function drawClock(h,m){let c=document.createElement('div');c.className='clock';let hh=document.createElement('div'),mm=document.createElement('div'),i=document.createElement('i');hh.className='hand hour';mm.className='hand minute';hh.style.transform=`rotate(${h*30+m/2}deg)`;mm.style.transform=`rotate(${m*6}deg)`;c.append(hh,mm,i);$('game').appendChild(c)}function clock(){if(step===0){text('壁のメモ：「短い針は3、長い針は12」。時計は何時？');drawClock(3,0);choices(['3時00分','12時15分','6時00分'],0,()=>tick(),'3時ちょうど。')}else if(step===1){text('次の時計は、長い針が6。短い針は8と9の間。何時？');drawClock(8,30);choices(['6時08分','8時30分','8時00分'],1,()=>tick(),'長い針が6なら30分。')}else if(step===2){text('装置の指示：「午後4時15分」を24時間の表示で入力せよ。');choices(['04:15','16:15','15:40'],1,()=>{add('🕓 時刻コード：16:15');tick()},'午後4時は16時。')}else if(step===3){text('制御盤の歯車が欠けている。持ち物の歯車を使おう。');next('⚙️ 歯車を取り付ける',()=>{add('🔌 通信カード');tick()})}else{next('▶ 文字の通信室へ',advance)}}function alphabet(){if(step===0){text('端末の画面：「A の次の文字を押せ」。');choices(['D','B','F'],1,()=>tick(),'A → B → C の順番。')}else if(step===1){text('画面：「大文字 C と同じ文字は？」');choices(['c','s','e'],0,()=>tick(),'C と c は同じ文字。')}else if(step===2){text('端末に「A B _ D」と表示された。空欄は？');choices(['G','C','E'],1,()=>tick(),'A B C D。')}else if(step===3){text('カードに「C A B」とある。アルファベット順に並べると？');choices(['ABC','BAC','CAB'],0,()=>{add('🔡 文字コード：ABC');tick()},'正しい順番は ABC。')}else if(step===4){text('通信装置の最後の問題。「B」の小文字を選べ。');choices(['d','p','b'],2,()=>tick(),'B と b は同じ文字。')}else{text('通信が復旧！最終ゲートの解除情報が送られてきた。');next('▶ 最後のゲートへ',advance)}}function gate(){if(step===0){text('扉の表示：「漢字コードの真ん中の漢字を選べ」。');choices(['光','森','門'],1,()=>tick(),'光 → 森 → 門 の真ん中。')}else if(step===1){text('時計の装置で見つけた時刻コードは？');choices(['16:15','08:30','03:00'],0,()=>tick(),'午後4時15分だった。')}else if(step===2){text('文字の通信室で手に入れた3文字のコードは？');choices(['CBA','ABC','ACB'],1,()=>tick(),'ABC が正しい順番。')}else if(step===3){text('最後のロックが点滅している。扉を開ける前に、確認ボタンを押そう。');next('🔓 最終ロックを解除',()=>{step++;render()})}else{next('🚪 脱出する！',advance)}}function finish(){$('stage').textContent='MISSION COMPLETE';$('progress').style.width='100%';$('scene').innerHTML='🌅 🎉<small>研究所からの脱出に成功！</small>';$('title').textContent='ESCAPE SUCCESS!';$('story').textContent='漢字、時計、アルファベットの暗号を解いて、最後の扉を開けた！';$('game').innerHTML='';text('何度でも再挑戦できる。次はヒントを使わずにクリアしてみよう。');next('↻ もう一度遊ぶ',restart);msg(`クリア！ ヒント ${hintCount} 回 / ミス ${mistakes} 回`)}function restart(){phase=0;step=0;inventory=[];mistakes=0;hintCount=0;renderInv();render()}const hints=[['机から調べよう。','海の色は何色？','鍵穴には鍵を使うよ。','次の部屋へ進もう。'],['ひかり、という意味。','木が3つ集まった漢字。','入口にあるもの。','歯車を取ろう。'],['長い針が12なら00分。','長い針が6なら30分。','午後の時刻には12を足すよ。','歯車を使おう。'],['A B C と声に出そう。','大文字と小文字は形が似ているよ。','A B C D。','Aから順に並べて。','Bの小文字は b。','次へ進もう。'],['光・森・門の真ん中。','午後4時は16時。','Aから順に並べて。','確認ボタンを押そう。','脱出しよう。']];$('hint').onclick=()=>{hintCount++;msg('💡 '+(hints[phase]?.[Math.min(step,hints[phase].length-1)]||'周りを調べてみよう。'))};$('reset').onclick=()=>{if(confirm('最初からやり直す？'))restart()};$('speak').onclick=()=>{let speech=window.speechSynthesis;if(!speech){msg('この端末では読み上げが使えません。');return}speech.cancel();let u=new SpeechSynthesisUtterance($('title').textContent+'。'+$('story').textContent+'。'+$('game').innerText);u.lang='ja-JP';u.rate=.86;speech.speak(u)};renderInv();render()})();
</script></body></html>
