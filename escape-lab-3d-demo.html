<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ESCAPE LAB 3D — 体験版</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c15;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:env(safe-area-inset-top,10px);left:14px;right:14px;pointer-events:none;text-shadow:0 2px 5px #000}#hud h1{font-size:17px;letter-spacing:.15em;margin:12px 0 4px}#hud p{font-size:12px;color:#bdd5e8;margin:0}#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));width:max-content;max-width:85vw;text-align:center;font-size:13px;background:#101c2be6;border:1px solid #52738b;border-radius:12px;padding:9px 13px;pointer-events:none}#stick{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:25px;width:112px;height:112px;border-radius:50%;border:2px solid #b6d4e65c;background:#a5cee51a;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#8cd9edaa;border:2px solid #dbf8ff}#act{position:absolute;right:22px;bottom:calc(45px + env(safe-area-inset-bottom,0px));height:68px;width:68px;border-radius:50%;background:#16465de8;border:2px solid #80d8f1;color:white;font-weight:bold;font-size:14px}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#e1f9ffbb;font-size:26px;pointer-events:none}#help{position:absolute;top:70px;right:14px;border:1px solid #8eb8c6;background:#102231cf;color:white;padding:8px 10px;border-radius:9px;font-size:12px}#overlay{position:absolute;inset:0;background:#07101ce8;display:flex;align-items:center;justify-content:center;padding:25px}#panel{max-width:380px;text-align:center;border:1px solid #487c95;background:#102233;padding:24px;border-radius:18px}#panel h2{letter-spacing:.15em}#panel p{line-height:1.9;color:#d6e7ee}#start{padding:13px 35px;background:#72d5eb;color:#05212e;border:0;border-radius:12px;font-size:17px;font-weight:bold}#close{position:absolute;top:15px;right:16px;border:0;background:transparent;color:white;font-size:25px}#info{position:absolute;inset:0;background:#07101ce9;display:none;align-items:center;justify-content:center;padding:24px}#info .inner{max-width:360px;background:#122b3a;border:1px solid #69b8ce;border-radius:14px;padding:28px;text-align:center;line-height:1.8}#info button{background:#7fd4e5;border:0;border-radius:9px;padding:10px 26px;color:#09212d;font-weight:bold}</style></head><body><canvas id="view"></canvas><div id="hud"><h1>ESCAPE LAB <span style="color:#8de3f4">3D</span></h1><p>第一研究室 · 体験版</p></div><div id="cross">＋</div><button id="help">操作方法</button><div id="msg">左の丸で歩く · 右側をなぞって見回す</div><div id="stick"><div id="nub"></div></div><button id="act">調べる</button><div id="overlay"><div id="panel"><h2>ESCAPE LAB 3D</h2><p>研究室に閉じ込められた。<br>部屋を歩き、周囲を360度見渡そう。<br><small>左の丸：移動 ／ 画面右側：視点 ／ 調べる：目の前の物</small></p><button id="start">研究室に入る</button></div></div><div id="info"><div class="inner"><h2 id="infoTitle"></h2><p id="infoText"></p><button id="ok">戻る</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});const map=['111111111111','100000000001','100000000001','100000000001','100000000001','100000000001','100000000001','100000000001','100000000001','111111111111'];const objs=[{x:5.8,y:1.45,type:'door',name:'鉄の扉',desc:'頑丈な扉。電子ロックがかかっている。まだ開かない。'},{x:2.2,y:2.3,type:'desk',name:'研究机',desc:'古い研究記録が置かれている。次のバージョンでは、ここに謎解きを追加するよ。'},{x:9.2,y:3.1,type:'terminal',name:'端末',desc:'画面に「SYSTEM LOCKED」と表示されている。'},{x:8.7,y:7.5,type:'box',name:'保管箱',desc:'鍵のかかった保管箱。中に何か入っていそうだ。'}];let px=5.5,py=6.5,angle=-Math.PI/2,joyX=0,joyY=0,lookId=null,lastX=0,stickId=null,last=performance.now(),started=false;const isWall=(x,y)=>!map[Math.floor(y)]||map[Math.floor(y)][Math.floor(x)]!=='0';function resize(){let scale=Math.min(devicePixelRatio||1,1.3);canvas.width=Math.floor(innerWidth*scale);canvas.height=Math.floor(innerHeight*scale)}addEventListener('resize',resize);resize();const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function cast(a){let dx=Math.cos(a),dy=Math.sin(a),dist=0;while(dist<19){dist+=.035;let x=px+dx*dist,y=py+dy*dist;if(isWall(x,y)){let fx=x-Math.floor(x),fy=y-Math.floor(y);return {d:dist,side:Math.min(fx,1-fx)<Math.min(fy,1-fy)?1:0,x,y}}}return {d:19,side:0}}function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(started&&!document.getElementById('info').style.display.includes('flex')){let forward=-joyY,strafe=joyX;let speed=2.25*dt;let vx=(Math.cos(angle)*forward-Math.sin(angle)*strafe)*speed,vy=(Math.sin(angle)*forward+Math.cos(angle)*strafe)*speed;const r=.22;if(!isWall(px+vx+Math.sign(vx)*r,py))px+=vx;if(!isWall(px,py+vy+Math.sign(vy)*r))py+=vy}render();requestAnimationFrame(frame)}function render(){let w=canvas.width,h=canvas.height,mid=h*.50;let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#081421');bg.addColorStop(.49,'#182d3c');bg.addColorStop(.50,'#17222c');bg.addColorStop(1,'#080e17');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const fov=Math.PI/2.75,cols=Math.min(380,Math.ceil(w/3)),cw=w/cols,depth=new Float32Array(cols);for(let i=0;i<cols;i++){let a=angle+Math.atan((i/cols-.5)*2*Math.tan(fov/2)),hit=cast(a),d=Math.max(.12,hit.d*Math.cos(a-angle));depth[i]=d;let wh=Math.min(h*2,h/(d*Math.tan(fov/2)*1.8)),top=mid-wh/2;let shade=clamp(1-d/16,.2,.95)*(hit.side?.72:1);let r=Math.floor(35*shade),g=Math.floor(83*shade),b=Math.floor(104*shade);ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(i*cw,top,cw+1,wh);ctx.fillStyle=`rgba(0,0,0,${.12+.20*(Math.floor(hit.x+hit.y)%2)})`;ctx.fillRect(i*cw,top,cw+1,Math.max(2,wh*.018));} // perspective floor grid
ctx.strokeStyle='#75bbd015';ctx.lineWidth=Math.max(1,w/700);for(let j=1;j<=8;j++){let y=mid+(h-mid)*(1-1/(1+j*.55));ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
let visible=objs.map(o=>{let dx=o.x-px,dy=o.y-py,d=Math.hypot(dx,dy),diff=Math.atan2(Math.sin(Math.atan2(dy,dx)-angle),Math.cos(Math.atan2(dy,dx)-angle));return {...o,d,diff}}).filter(o=>Math.abs(o.diff)<fov*.85&&o.d>.25).sort((a,b)=>b.d-a.d);for(let o of visible){let sx=(.5+Math.tan(o.diff)/(2*Math.tan(fov/2)))*w,idx=clamp(Math.floor(sx/cw),0,cols-1);if(o.d>depth[idx]+.4)continue;let size=Math.min(h*1.1,h/(o.d*1.6)),ww=size*(o.type==='door'?.62:o.type==='desk'?1.2:.72),yy=mid+size*.10-size/2;ctx.fillStyle='#0009';ctx.fillRect(sx-ww/2+5,yy+7,ww,size);let color=o.type==='door'?'#637d89':o.type==='desk'?'#685c4e':o.type==='terminal'?'#244d62':'#6b786d';ctx.fillStyle=color;ctx.fillRect(sx-ww/2,yy,ww,size);ctx.strokeStyle='#b1d9e0';ctx.lineWidth=Math.max(1,w/350);ctx.strokeRect(sx-ww/2,yy,ww,size);if(o.type==='terminal'){ctx.fillStyle='#061b2b';ctx.fillRect(sx-ww*.40,yy+size*.12,ww*.8,size*.55);ctx.fillStyle='#80f0f1';ctx.font=`${Math.max(8,size*.09)}px monospace`;ctx.textAlign='center';ctx.fillText('LOCKED',sx,yy+size*.42)}if(o.type==='door'){ctx.fillStyle='#b7e6ee';ctx.fillRect(sx+ww*.26,yy+size*.52,ww*.09,size*.07)}if(o.type==='desk'){ctx.fillStyle='#b3c1ba';ctx.fillRect(sx-ww*.3,yy+size*.12,ww*.6,size*.08)}ctx.fillStyle='#f0fbff';ctx.textAlign='center';ctx.font=`${Math.max(11,w/44)}px sans-serif`;ctx.fillText(o.name,sx,yy-9)}let nearest=target();document.getElementById('act').style.opacity=nearest?'1':'.45';document.getElementById('msg').textContent=nearest?`${nearest.name}：右下の「調べる」を押そう`:'左の丸で歩く · 右側をなぞって見回す'}function target(){let best=null,dist=2.0;for(let o of objs){let d=Math.hypot(o.x-px,o.y-py),a=Math.atan2(o.y-py,o.x-px),diff=Math.abs(Math.atan2(Math.sin(a-angle),Math.cos(a-angle)));if(d<dist&&diff<.36){best=o;dist=d}}return best}document.getElementById('act').onclick=()=>{let o=target();if(!o)return;document.getElementById('infoTitle').textContent=o.name;document.getElementById('infoText').textContent=o.desc;document.getElementById('info').style.display='flex'};document.getElementById('ok').onclick=()=>document.getElementById('info').style.display='none';document.getElementById('start').onclick=()=>{document.getElementById('overlay').style.display='none';started=true};document.getElementById('help').onclick=()=>{document.getElementById('infoTitle').textContent='操作方法';document.getElementById('infoText').textContent='左下の丸を上下左右に動かして歩こう。画面の右側を指でなぞると360度見渡せるよ。物の近くで正面を向いて「調べる」を押してね。';document.getElementById('info').style.display='flex'};const stick=document.getElementById('stick'),nub=document.getElementById('nub');function setStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),m=37;if(len>m){x*=m/len;y*=m/len}joyX=x/m;joyY=y/m;nub.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function endStick(e){if(e.pointerId!==stickId)return;stickId=null;joyX=joyY=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);canvas.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.28)return;lookId=e.pointerId;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==lookId||!started)return;let dx=e.clientX-lastX;angle+=dx/Math.max(220,innerWidth)*2.8;lastX=e.clientX});canvas.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});canvas.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});setInterval(()=>{if(stickId!==null)return;joyY=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);joyX=(keys.d?1:0)-(keys.a?1:0);if(keys.arrowleft)angle-=.06;if(keys.arrowright)angle+=.06},30);requestAnimationFrame(frame)})();
</script></body></html>
