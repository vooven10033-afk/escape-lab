<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESCAPE LAB｜脱出ミッション</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#eaf5ff;background:#080f21}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 70% 5%,#173765,#080f21 65%)}main{max-width:530px;margin:auto;padding:18px 18px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:900;letter-spacing:.17em;color:#79e8ff;font-size:20px}.badge{border:1px solid #4a6d9d;border-radius:30px;padding:7px 11px;color:#b8cdec;font-size:12px}.bar{height:8px;background:#1e304c;border-radius:20px;margin:18px 0 26px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#45d9ed,#9e8dff);transition:width .4s}h1{font-size:clamp(24px,7vw,33px);line-height:1.5;margin:0 0 12px}.sub{color:#b6c8df;font-size:15px;line-height:1.9;margin:0 0 18px}.room{position:relative;height:240px;border:2px solid #3c648e;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,#1a3956,#0b172b 65%);box-shadow:inset 0 0 40px #061326,0 15px 40px #020713}.room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 33px,#8ad6ff08 34px),repeating-linear-gradient(90deg,transparent 0 45px,#8ad6ff08 46px)}.door{position:absolute;left:34%;top:25px;width:32%;height:205px;border:5px solid #54759c;border-bottom:0;border-radius:12px 12px 0 0;background:linear-gradient(100deg,#182f49,#0c182b);box-shadow:0 0 28px #4fbbef33}.door:after{content:"◉";position:absolute;right:13px;top:95px;color:#6df5db}.glow{position:absolute;left:50%;top:56px;transform:translateX(-50%);color:#78e7ff;text-shadow:0 0 18px #4ed7ff;font-weight:800;letter-spacing:.15em}.room-label{position:absolute;bottom:12px;left:15px;color:#a6c6e5;font-size:12px}.panel{background:#14243e;border:1px solid #385477;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 10px 25px #0003}.question{font-size:clamp(22px,6vw,28px);font-weight:800;line-height:1.8;white-space:pre-line;margin:6px 0 17px;letter-spacing:.03em}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #ffe77c;outline-offset:3px}.minor{background:#263e5d;color:#fff;border:1px solid #577599;border-radius:13px;padding:12px 15px;font-weight:700}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#233f61;color:#fff;border:2px solid #4d739b;border-radius:16px;min-height:88px;padding:13px 9px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #0b172a}.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #0b172a}.feedback{min-height:55px;color:#a5f7d9;font-weight:700;line-height:1.7;padding-top:14px}.hint{color:#ffe4a2;background:#3d352f;border-radius:12px;padding:12px;margin:8px 0 16px;line-height:1.8}.primary{width:100%;background:linear-gradient(90deg,#52dfe9,#a29bff);color:#09142a;padding:16px;border-radius:14px;font-weight:900;font-size:19px;margin-top:12px}.small{font-size:12px;color:#9db2cf;line-height:1.8;margin-top:18px}.hidden{display:none!important}.stars{font-size:44px;text-align:center;margin:22px 0} .reset{margin-top:15px;width:100%}@media(max-width:350px){.choice{font-size:19px}.panel{padding:15px}}
</style></head><body><main><div class="top"><div class="logo">ESCAPE LAB</div><div class="badge" id="stageLabel">MISSION 01 / 03</div></div><div class="bar"><div id="progress" style="width:0%"></div></div><h1 id="heading">研究所から 脱出せよ。</h1><p class="sub" id="intro">ドアは ロックされている。<br>3つの ナゾを 解こう。</p><div class="room" aria-label="研究所の閉じたドア"><div class="door"></div><div class="glow" id="doorText">LOCKED</div><div class="room-label">SECTOR 07 — EXIT GATE</div></div><section class="panel" id="game"><div class="question" id="question"></div><div class="controls"><button class="minor" id="speak">🔊 よみあげ</button><button class="minor" id="hintBtn">💡 ヒント</button></div><div class="hint hidden" id="hint" role="status"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="primary hidden" id="next">つぎへ ➜</button></section><section class="panel hidden" id="finish"><div class="stars">✨ 🔓 ✨</div><h1 style="text-align:center">脱出 成功！</h1><p class="sub" style="text-align:center">3つの ロックを 解除した！<br>ミッション クリア！</p><button class="primary" id="again">もう一度 あそぶ</button></section><button class="minor reset" id="restart">↻ はじめから</button><p class="small">音声は スマホの 読み上げ機能を 使います。端末やブラウザによっては 音が出ないことがあります。音量も確認してください。</p></main><script>
const missions=[{heading:'赤い カギを 探せ。',question:'赤い カギを\n3つ 集めろ。',spoken:'あかい かぎを、みっつ あつめろ。',hint:'「赤い」カギを えらぼう。\n3つ あるものだよ。',options:['🔴 🔴 🔴','🔵 🔵 🔵','🔴 🔴','🟡 🟡 🟡'],answer:0,success:'赤い カギを 3つ ゲット！'},{heading:'金庫の 暗号を 解け。',question:'2 と 3 を\nあわせると いくつ？',spoken:'に と さん を あわせると、いくつ？',hint:'● ● と ● ● ●\nまるを かぞえてみよう。',options:['4','5','6','7'],answer:1,success:'金庫が 開いた！'},{heading:'最後の ドアを 開け。',question:'「ひかり」 と よむ\nカードは どれ？',spoken:'ひかり と よむ カードは どれ？',hint:'太陽や ライトから 出るものだよ。\n「光」は ひかり と よむよ。',options:['音','水','光','風'],answer:2,success:'最後の ロックを 解除！'}];let stage=0,cleared=false;const $=id=>document.getElementById(id);function speak(s){if(!('speechSynthesis'in window)){ $('feedback').textContent='この スマホでは 音声が 使えないみたい。';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.83;u.pitch=1;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}function render(){cleared=false;let m=missions[stage];$('stageLabel').textContent=`MISSION 0${stage+1} / 03`;$('progress').style.width=`${stage/3*100}%`;$('heading').textContent=m.heading;$('intro').innerHTML='部屋の ナゾを 解いて、<br>ロックを はずそう。';$('question').textContent=m.question;$('hint').classList.add('hidden');$('hint').textContent=m.hint;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').innerHTML='';$('doorText').textContent=`LOCK 0${stage+1}`;m.options.forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=s;b.onclick=()=>answer(i);$('choices').append(b)});$('game').classList.remove('hidden');$('finish').classList.add('hidden')}function answer(i){if(cleared)return;let m=missions[stage];if(i===m.answer){cleared=true;$('feedback').textContent='✨ '+m.success;$('doorText').textContent='UNLOCKED';[...$('choices').children].forEach(b=>b.disabled=true);$('next').textContent=stage===2?'脱出する ➜':'つぎの ミッション ➜';$('next').classList.remove('hidden')}else{$('feedback').textContent='だいじょうぶ。ほかも ためしてみよう。💡 ヒントも 使えるよ。'}}$('speak').onclick=()=>speak(missions[stage].spoken);$('hintBtn').onclick=()=>{$('hint').classList.remove('hidden');speak(missions[stage].hint)};$('next').onclick=()=>{stage++;if(stage<3){render()}else{$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('progress').style.width='100%';$('heading').textContent='EXIT OPEN';$('intro').textContent='ドアが 開いた！';$('stageLabel').textContent='COMPLETE';$('doorText').textContent='OPEN';speak('だっしゅつ せいこう！ ミッション クリア！')}};function reset(){speechSynthesis?.cancel();stage=0;render()}$('restart').onclick=reset;$('again').onclick=reset;render();</script></body></html>
