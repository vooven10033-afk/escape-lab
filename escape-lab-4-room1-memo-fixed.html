/* ESCAPE LAB visual upgrade: all puzzle and navigation logic preserved */
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:#050b12;color:#e4f5f5}
body{background:radial-gradient(ellipse at 50% -20%,#19313b 0%,#08121b 45%,#03070d 100%);min-height:100vh}
.app{max-width:900px;padding:12px 14px 25px}
.top{border-bottom:1px solid #3b6771;padding:10px 2px 14px;margin-bottom:10px}
.top strong{letter-spacing:.19em;font-size:clamp(19px,4vw,26px);color:#b9f7ed;text-shadow:0 0 18px #3dd2b755}
.chip{background:#0d2932;border-color:#377b82;box-shadow:inset 0 0 12px #35bbac16}
.progress{background:#0b2028;height:6px}.progress div{background:linear-gradient(90deg,#2c7d87,#83e9c5);box-shadow:0 0 9px #67f5d1}
.room{height:min(61vw,460px);min-height:310px;border:2px solid #315560;border-radius:9px;background:radial-gradient(ellipse at 52% 28%,#4d6268 0%,#243741 32%,#101e28 72%,#050b13 100%);box-shadow:inset 0 0 110px #02060ad9,0 18px 40px #000b,0 0 22px #2ac0ad16;isolation:isolate}
.room:before{z-index:3;background:linear-gradient(180deg,#0a19205c 0%,transparent 27%,#02080c50 100%),repeating-linear-gradient(0deg,transparent 0 3px,#00000009 4px 5px);pointer-events:none}
.room:after{content:"";position:absolute;z-index:2;pointer-events:none;left:3%;right:3%;top:0;height:64%;background:radial-gradient(ellipse at 50% 0%,#b5f9e526 0%,#a6e9d70c 34%,transparent 70%);mix-blend-mode:screen}
.ceiling{left:0;right:0;top:0;height:19%;clip-path:polygon(0 0,100% 0,83% 100%,17% 100%);background:linear-gradient(180deg,#101b22,#34474f 78%,#19272e);border-bottom:2px solid #6c8e8c}
.ceiling:after{content:"";position:absolute;left:35%;right:35%;top:28%;height:20%;background:#b7e9d8;box-shadow:0 0 13px 5px #a1e9d56e,0 0 65px 28px #86c8bb26;border-radius:3px}
.floor{height:33%;opacity:1;background:repeating-linear-gradient(90deg,transparent 0 9.8%,#8cb0b01c 10% 10.2%),repeating-linear-gradient(0deg,#182831 0 23%,#253942 24% 25%);border-top:3px solid #324b53}
.wallTitle{top:11px;left:12px;background:#04151ddc;border:1px solid #4c9394;color:#aee9df;letter-spacing:.05em;box-shadow:0 0 14px #0009;font-size:12px}
.obj{transition:filter .15s,box-shadow .15s;border:2px solid #7899a48c;box-shadow:7px 12px 22px #000b,inset 1px 1px 2px #ffffff35;background:linear-gradient(125deg,#566c74,#1a2c35 55%,#0e1c24);text-shadow:0 2px 4px #000;overflow:hidden}
.obj:before{content:"";position:absolute;inset:4px;border:1px solid #a9e9e51b;pointer-events:none}
.obj:active{filter:brightness(1.35)}.obj .symbol{filter:drop-shadow(0 4px 4px #000b);font-size:clamp(25px,5.5vw,42px)}
.obj .name{position:relative;background:#04141ddd;border:1px solid #789a9d55;color:#e3f4f2;padding:4px 7px;letter-spacing:.04em}
.desk{background:linear-gradient(180deg,#72675b 0 13%,#272d30 14% 23%,#39444a 24% 75%,#101b23 76%);border-top:8px solid #8c8173;border-radius:3px;box-shadow:7px 17px 25px #000c,inset 0 -15px 20px #0006}
.clock{background:radial-gradient(circle at 43% 38%,#e6e0c7 0%,#b9bba9 52%,#6b7776 56%,#17262e 66%,#0a141a 78%);border:7px solid #384e55;box-shadow:0 0 0 3px #101e25,9px 14px 23px #000b}
.shelf{background:repeating-linear-gradient(0deg,#16262f 0 12%,#5d5145 13% 15%,#131e27 16% 18%),repeating-linear-gradient(90deg,#795f4a 0 7%,#30444d 8% 16%,#a48768 17% 21%);border:8px solid #4b4740;box-shadow:inset 0 0 35px #000a,8px 13px 22px #000a}
.locker{background:repeating-linear-gradient(90deg,#25343d 0 44%,#617b84 46% 49%,#1c303b 50% 95%,#0a1c27 96%);border:5px solid #536c74;box-shadow:inset 0 0 30px #0009,8px 14px 20px #000a}
.cabinet{background:linear-gradient(145deg,#344852,#0c1820 65%);border:5px solid #50616b;box-shadow:inset 0 0 35px #000,8px 14px 20px #000a}
.board{background:linear-gradient(145deg,#a59b7f,#6e715f);border:9px solid #424c46;box-shadow:inset 0 0 15px #302b1f88,8px 12px 20px #000a}
.door{background:linear-gradient(90deg,#0d1c25,#354e5a 15%,#263e49 50%,#101f28 87%,#08131b);border:10px solid #101f28;box-shadow:0 0 0 3px #587780,8px 14px 22px #000c}
.lamp{background:linear-gradient(140deg,#34474e,#142630);border:4px solid #677c7a}.panel{background:linear-gradient(140deg,#283f4b,#0b1a25);border:5px solid #506e75;box-shadow:inset 0 0 16px #0009,0 0 20px #66c8b422}
.nav{gap:10px;margin:13px 0}.nav button,.toolbar button,.modal button,.inventory button{background:linear-gradient(180deg,#244653,#112b39);border:1px solid #4f8690;color:#e5f6f4;box-shadow:inset 0 1px #ffffff19,0 3px 10px #0005;border-radius:7px}
.nav button{padding:14px 8px;font-weight:700}.nav button:active,.toolbar button:active{background:#2d6970}
.inventory{background:#0b1b26;border:1px solid #294f5c;min-height:74px}.inventory button.selected{background:#b6a15e;color:#101a21}
.notice{background:#10252e;border-left:3px solid #67bfae;padding:10px 12px;min-height:44px;border-radius:3px;color:#dce9bd}
.modal{background:linear-gradient(160deg,#263f48,#10242f 60%,#0b1a24);border:1px solid #72aaa9;box-shadow:0 15px 70px #000,0 0 24px #4fb5ac22}.modal h2{color:#bdf4e6}.hint{border-left:3px solid #b6d9a0}.note{box-shadow:0 5px 20px #0006}
@media(max-width:450px){.room{min-height:315px}.obj .name{font-size:11px}.nav button{padding:13px 5px}}

(()=>{'use strict';const KEY='escape_lab_4_room1_v1';const defaults=()=>({view:0,items:[],solved:[],flags:[],hint:0});let state;try{state=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=defaults()}let selected='',active='',message='';const $=id=>document.getElementById(id),has=x=>state.items.includes(x),flag=x=>state.flags.includes(x),solved=x=>state.solved.includes(x);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function add(x){if(!has(x))state.items.push(x);save();render()}function mark(x){if(!solved(x))state.solved.push(x);save();render()}function setFlag(x){if(!flag(x))state.flags.push(x);save();render()}function say(t){message=t;$('notice').textContent=t}function speech(t){if(!('speechSynthesis'in window)){say('このブラウザでは読み上げできません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,''));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}const ruby=(a,b)=>`<ruby>${a}<rt>${b}</rt></ruby>`;const labels={flash:'🔦 でんとう',battery:'🔋 でんち',torch:'💡 ひかるでんとう',memo:'📄 メモ',key:'🗝️ ちいさなかぎ',symbols:'🔣 きごうメモ',archive:'🗝️ しりょうしつのかぎ'};const walls=[{title:'① つくえ と とけい',objects:[['desk','desk','🗄️','つくえ'],['clock','clock','🕒','とけい']]},{title:'② ほんだな と ロッカー',objects:[['shelf','shelf','📚','ほんだな'],['locker','locker','🔐','ロッカー']]},{title:'③ くらい たな と けいじばん',objects:[['cabinet','cabinet','🌑','くらいたな'],['board','board','📋','けいじばん']]},{title:'④ とびら と そうち',objects:[['door','door','🚪','とびら'],['lamp','lamp','🔦','どうぐばこ'],['panel','panel','⚙️','そうち']]}];function render(){$('room').classList.toggle('photo-view',state.view===0);$('room').classList.toggle('shelf-photo',state.view===1);$('room').classList.toggle('third-photo',state.view===2);$('room').classList.toggle('fourth-photo',state.view===3);const w=walls[state.view];$('wallTitle').textContent=w.title;$('objects').innerHTML='';w.objects.forEach(([id,cls,emoji,name])=>{let b=document.createElement('button');b.className='obj '+cls;b.innerHTML=`<span class="symbol">${emoji}</span><span class="name">${name}</span>`;b.setAttribute('aria-label',name);b.onclick=()=>openObj(id);$('objects').appendChild(b)});$('inventory').innerHTML='';if(!state.items.length)$('inventory').textContent='まだ ありません';state.items.forEach(id=>{const b=document.createElement('button');b.textContent=labels[id]||id;b.className=selected===id?'selected':'';b.onclick=()=>{if(id==='symbols'){modal('🔣 きごうメモ','<p>くらい たなで みつけた きごう。</p><div class="note" style="text-align:center;font-size:36px;letter-spacing:.15em">★ → ● → ▲</div><p>ロッカーの ロックに つかえそうだ。</p>');return}if(id==='memo'){modal('📄 メモ','<div class="note">とけい：<br>みじかい はり＝ほんの かず<br>ながい はり＝あかい しるし</div>');return}if(selected&&selected!==id){combine(selected,id);return}selected=selected===id?'':id;say(selected?'えらんだよ。ほかのアイテムをタップすると くみあわせられるよ。':'');render()};$('inventory').appendChild(b)});$('count').textContent=state.solved.length+' / 4 かいじょ';$('bar').style.width=(state.solved.length/4*100)+'%';$('notice').textContent=message;save()}
function modal(title,body,buttons=[]){active=title;const ov=$('overlay');ov.hidden=false;ov.innerHTML='';const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');const x=document.createElement('button');x.className='close';x.textContent='✕ とじる';x.onclick=close;m.appendChild(x);const h=document.createElement('h2');h.textContent=title;m.appendChild(h);const p=document.createElement('div');p.innerHTML=body;m.appendChild(p);const actions=document.createElement('div');actions.className='actions';buttons.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=fn;actions.appendChild(b)});m.appendChild(actions);ov.appendChild(m)}function close(){$('overlay').hidden=true;active='';render()}function take(id,text){add(id);say(text);close()}
function combine(a,b){selected='';if([a,b].includes('flash')&&[a,b].includes('battery')){state.items=state.items.filter(x=>x!=='flash'&&x!=='battery');add('torch');say('カチッ！ でんとうが ひかった！');modal('アイテムが できた！','🔦 ＋ 🔋 → 💡<p>これで くらい ところを しらべられる！</p>')}else{say('この ふたつは くみあわせられないみたい。');render()}}
function openObj(id){switch(id){case 'desk':modal('つくえ',`<p>ひきだしに 3けたの ダイヤルが ある。</p><p>つくえの うえに ふるい メモも ある。</p>`,[['メモを ひろう',()=>has('memo')?modal('メモ','<div class="note">とけい：<br>みじかい はり＝ほんの かず<br>ながい はり＝あかい しるし</div>'):take('memo','メモを てにいれた！')],['ダイヤルを しらべる',()=>dial()]]);break;
case 'clock':modal('とけい',`<div class="clockface">🕰️</div><p>はりを あわせると うごきそうだ。</p>${solved('clock')?'<p>もう しかけは とけている。</p>':''}`,[['はりを あわせる',clockPuzzle]]);break;
case 'shelf':modal('ほんだな',`<p>3さつの ほんが ならんでいる。</p><div class="note">🌳🌳🌳<br>「${ruby('木','き')}」の えが ある ほんは 3さつ。</div><p>せびょうしに ① ② ③ の ばんごうが ある。</p>`,[['ほんを しらべる',()=>modal('ほんの なか','<p>3ばんの ほんに「<strong>3</strong>」と かかれた しおりが ある。</p><p>うらには「<strong>ながい はり＝6</strong>」の しるし。</p>')]]);break;
case 'locker':if(solved('locker'))modal('ロッカー','<p>もう あいている。しりょうしつの かぎを てにいれた。</p>');else modal('ロッカー',`<p>3つの きごうを ならべる ロックだ。</p><p>ヒント：くらい たなに あるかも。</p>`,[['きごうを いれる',lockerPuzzle]]);break;
case 'cabinet':if(!has('torch'))modal('くらい たな','<p>まっくらで なにも みえない。</p><p>あかりが あれば しらべられそう。</p>');else if(!flag('cabinet'))modal('くらい たな','<p>でんとうで てらすと、かべに 3つの きごうが うかんだ！</p><div class="note">★ → ● → ▲</div>',[['きごうを メモする',()=>{setFlag('cabinet');take('symbols','きごうを メモした！')}]]);else modal('くらい たな','<div class="note">★ → ● → ▲</div>');break;
case 'board':modal('けいじばん',`<p>けんきゅういんの メモが ある。</p><div class="note">${ruby('時計','とけい')}の ヒント<br>・みじかい はり＝ほんの かず<br>・ながい はり＝ほんの うらの しるし<br><hr>ひきだしの ばんごう：<strong>ほん・とけい・ロッカー</strong> の じゅん</div>`);break;
case 'door':modal('しりょうしつへの とびら',has('archive')?'<p>カギが あった！ とびらが ひらいた！</p><p>この さきは つぎの アップデートで つくるよ。</p>':'<p>カギが かかっている。ロッカーの なかに ありそう。</p>',has('archive')?[['とびらを あける',()=>{setFlag('finished');modal('🎉 だい1エリア クリア！','<p>おめでとう！ 4つの しかけを といたね。</p><p>つぎは しりょうしつへ すすむ じゅんびが できた！</p>')}]]:[]);break;
case 'lamp':modal('どうぐばこ',has('flash')||has('torch')?'<p>からっぽだ。</p>':'<p>でんちの ない でんとうが ある。</p>',has('flash')||has('torch')?[]:[['でんとうを ひろう',()=>take('flash','でんとうを てにいれた！')]]);break;
case 'panel':modal('そうち',`<p>4つの ランプが ある。${state.solved.length}こ ひかっている。</p><p>ちいさな メモ：ひきだしの 3けたは <strong>3・3・6</strong> に かんけいする。ただし じゅんばんは けいじばんを みよう。</p>`);break;}}
function dial(){if(solved('drawer')){modal('ひきだし','<p>ひきだしは あいている。</p>',has('battery')||has('torch')?[]:[['でんちを ひろう',()=>take('battery','でんちを てにいれた！')]]);return}puzzle('ひきだしの ダイヤル','ほん・とけい・ロッカーの じゅんで 3けたの ばんごうを いれよう。','336',()=>{mark('drawer');take('battery','カチッ！ ひきだしが あいて でんちを てにいれた！')})}
function clockPuzzle(){if(solved('clock')){modal('とけい','<p>とけいの うらが あいている。</p>',has('key')?[]:[['かぎを ひろう',()=>take('key','ちいさな かぎを てにいれた！')]]);return}modal('とけいの はり',`<p>みじかい はり（じ）と ながい はり（ふん）を えらぼう。</p><label>じ：<select id="hour">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>　<label>ふん：<select id="minute">${[0,5,10,15,20,25,30,35,40,45,50,55].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label>`,[['あわせる',()=>{if(+$('hour').value===3&&+$('minute').value===30){mark('clock');modal('カチッ！','<p>とけいの うらから ちいさな かぎが でてきた！</p>',[['かぎを ひろう',()=>take('key','ちいさな かぎを てにいれた！')]])}else modal('まだ ちがう','<p>ほんだな と メモを もういちど しらべよう。</p>',[['もういちど',clockPuzzle]])}]] )}
function lockerPuzzle(){if(!flag('cabinet')){modal('ロッカーの ロック','<p>3つの きごうを しらべよう。どこかに かくれているはず。</p>');return}modal('きごう ロック',`<p>ただしい じゅんに えらぼう。</p><div class="options">${['★','●','▲'].map((x,i)=>`<button data-symbol="${x}">${x}</button>`).join('')}</div><p id="seq">えらんだ きごう：</p>`,[['けす',()=>lockerPuzzle]]);let seq='';document.querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>{seq+=b.dataset.symbol;$('seq').textContent='えらんだ きごう：'+seq;if(seq.length===3){if(seq==='★●▲'){mark('locker');modal('ロッカーが あいた！','<p>なかに しりょうしつの かぎが ある！</p>',[['かぎを ひろう',()=>take('archive','しりょうしつの かぎを てにいれた！')]])}else modal('じゅんばんが ちがう','<p>もういちど きごうを かくにんしよう。</p>',[['やりなおす',lockerPuzzle]])}})}
function puzzle(title,desc,answer,success){modal(title,`<p>${desc}</p><input id="answer" inputmode="numeric" maxlength="3" autocomplete="off" style="font-size:24px;width:100%;padding:10px;border-radius:7px" placeholder="3けたの すうじ">`,[['かくにん',()=>{if($('answer').value===answer)success();else modal('まだ ちがう','<p>ほかの ばしょの ヒントを みてみよう。</p>',[['もういちど',dial]])}]])}
const hints=['4つの ほうこうを よく みて、きになる ものを さがしてみよう。','ほんだな と けいじばん、つくえの メモが てがかり。でんとうも どこかに あるよ。','とけいは 3じ30ぷん。ひきだしは 336。でんとうに でんちを いれて くらい たなを てらそう。きごうは ★ ● ▲ だよ。'];$('help').onclick=()=>{const i=Math.min(state.hint,2);modal('ヒント '+(i+1)+'/3',`<div class="hint">${hints[i]}</div>`,i<2?[['つぎの ヒント',()=>{state.hint=i+1;save();$('help').click()}]]:[])};$('sound').onclick=()=>speech(message||'左右のボタンで向きを変え、気になるものをタップしよう。');$('prev').onclick=()=>{state.view=(state.view+3)%4;render()};$('next').onclick=()=>{state.view=(state.view+1)%4;render()};$('back').onclick=()=>{selected='';say('へやを みわたそう');render()};$('reset').onclick=()=>{if(confirm('はじめから やりなおす？ セーブも きえるよ。')){state=defaults();selected='';say('さいしょから スタート！');render()}};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});render();say('へやの どこかに 4つの しかけが ある。さがしてみよう！');
})();</script></body></html>
